# mom-archive nginx server block.
# Loopback only; the Cloudflare Tunnel (cloudflared) points at 127.0.0.1:5770.
# Serves front/dist and proxies /api/ to the backend on 127.0.0.1:5771.
#
# Install: copy to /etc/nginx/sites-available/momarchive, symlink into sites-enabled,
# adjust root to the checkout location, then: nginx -t && systemctl reload nginx

# Real client IP: cloudflared forwards CF-Connecting-IP; fall back to the socket address.
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 127.0.0.1:5770;
    server_name momarchive.caixa.cc;
    root /srv/mom-archive/front/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.momentum-mod.org https://avatars.cloudflare.steamstatic.com https://avatars.steamstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. {
        deny all;
    }

    # API: proxied untouched to the backend. Only GET (and HEAD) pass.
    location /api/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:5771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # Hashed Vite assets: safe to cache for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # The entry point must revalidate so deploys show up.
    location = /index.html {
        expires -1;
    }

    # SPA fallback for client side routes (/maps/..., /users/..., /runs/...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
