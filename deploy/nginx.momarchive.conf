# mom-archive nginx server blocks.
# Loopback only; the Cloudflare Tunnel (cloudflared) points at 127.0.0.1:5770.
# Serves the built frontend and proxies /api/ to the backend on 127.0.0.1:5771.
#
# The canonical host is momarchive.org. The old caixa.cc hostname and the www form
# are kept as permanent redirects in the second block below.
#
# Install: copy to sites-enabled, publish the frontend build to /var/www/momarchive
# (rsync -a --delete front/dist/ /var/www/momarchive/), then: nginx -t && systemctl reload nginx

# Real client IP: cloudflared forwards CF-Connecting-IP; fall back to the socket address.
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Sign in and panel requests, per real client IP. Brute forcing the owner's
# session is pointless anyway (there is no password), but keep it cheap to say no.
limit_req_zone $client_real_ip zone=momarchive_admin:10m rate=30r/m;

server {
    listen 127.0.0.1:5770;
    server_name momarchive.org;
    root /var/www/momarchive;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.momentum-mod.org https://avatars.cloudflare.steamstatic.com https://avatars.steamstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. {
        deny all;
    }

    # The owner's sign in and panel are the only paths that take a request body.
    # They are rate limited harder than the rest and never cached.
    location ~ ^/api/(auth|admin)/ {
        limit_except GET POST PATCH DELETE {
            deny all;
        }
        limit_req zone=momarchive_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:5771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # API: proxied untouched to the backend. Only GET (and HEAD) pass.
    location /api/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:5771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # Hashed Vite assets: safe to cache for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # The entry point must revalidate so deploys show up.
    location = /index.html {
        expires -1;
    }

    # SPA fallback for client side routes (/maps/..., /users/..., /runs/...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Old hostname and the www form. One permanent redirect to the canonical host with
# the path and query intact, so every link ever posted keeps working. Both names
# still have to reach nginx, so keep their tunnel routes pointing at 127.0.0.1:5770.
server {
    listen 127.0.0.1:5770;
    server_name momarchive.caixa.cc www.momarchive.org;

    server_tokens off;
    client_max_body_size 1m;

    return 301 https://momarchive.org$request_uri;
}
