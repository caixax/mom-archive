# mom-archive nginx server block.
# Listens on loopback only; Cloudflare Tunnel (cloudflared) points at 127.0.0.1:5770.
# Serves front/dist and proxies /api/ to the backend on 127.0.0.1:5771.
#
# Install: copy to /etc/nginx/sites-available/momarchive.conf, symlink into sites-enabled,
# adjust the root path, then: nginx -t && systemctl reload nginx

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Only GET and HEAD reach the backend.
map $request_method $momarchive_method_ok {
    default 0;
    GET     1;
    HEAD    1;
}

upstream momarchive_backend {
    server 127.0.0.1:5771;
    keepalive 16;
}

server {
    listen 127.0.0.1:5770;
    server_name momarchive.caixa.cc;

    # Adjust to the checkout location on the VPS
    root /srv/mom-archive/front/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 65s;

    access_log /var/log/nginx/momarchive.access.log;
    error_log /var/log/nginx/momarchive.error.log warn;

    # Security headers for the static site (the API sets its own through helmet)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.momentum-mod.org https://avatars.cloudflare.steamstatic.com https://avatars.steamstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    # Deny dotfiles everywhere
    location ~ /\. {
        deny all;
        return 404;
    }

    # API: proxied untouched to the backend
    location /api/ {
        if ($momarchive_method_ok = 0) {
            return 405;
        }
        proxy_pass http://momarchive_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass_request_body off;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_hide_header X-Powered-By;
        # Replay downloads can be large; no caching layer here, Cloudflare caches by Cache-Control
    }

    # Hashed static assets from Vite: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.momentum-mod.org https://avatars.cloudflare.steamstatic.com https://avatars.steamstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.momentum-mod.org https://avatars.cloudflare.steamstatic.com https://avatars.steamstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
